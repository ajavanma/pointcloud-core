name: Prepare or publish Python package

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the tested distributions to PyPI (requires a release tag and environment approval)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require the public project and an allowed release ref
        env:
          PROJECT: ${{ github.repository }}
          PRIVATE: ${{ github.event.repository.private }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          test "$PROJECT" = ajavanma/pointcloud-core
          test "$PRIVATE" = false
          if [ "$PUBLISH" = true ]; then
            case "$GITHUB_REF" in refs/tags/v*) ;; *) echo 'Publishing requires a v<version> tag.' >&2; exit 1 ;; esac
          else
            case "$GITHUB_REF" in refs/heads/main|refs/tags/v*) ;; *) echo 'Preparation requires main or a version tag.' >&2; exit 1 ;; esac
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Check the release version and main ancestry
        env:
          PUBLISH: ${{ inputs.publish }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          python -m pip install 'build>=1.2,<2' 'twine>=6,<7'
          python - <<'PY'
          import os
          import runpy
          from packaging.version import Version
          version = runpy.run_path('src/pointcloud_core/_version.py')['__version__']
          parsed = Version(version)
          if parsed.is_devrelease or parsed.local:
              raise SystemExit('Select a non-development package version.')
          ref = os.environ['GITHUB_REF']
          matching_tag = ref == 'refs/tags/v' + version
          if os.environ['PUBLISH'] == 'true' and not matching_tag:
              raise SystemExit('Publishing tag must exactly match the package version.')
          if ref.startswith('refs/tags/') and not matching_tag:
              raise SystemExit('Preparation tag must exactly match the package version.')
          PY
      - name: Build and inspect both distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Test the built wheel against minimum and current NumPy
        run: |
          for numpy_version in 1.26.4 '2.*'; do
            test_env="$RUNNER_TEMP/release-numpy-$numpy_version"
            python -m venv "$test_env"
            "$test_env/bin/python" -m pip install dist/*.whl "numpy==$numpy_version"
            "$test_env/bin/python" -m pip check
            (cd "$RUNNER_TEMP" && "$test_env/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v)
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  publish:
    if: ${{ inputs.publish }}
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/pointcloud-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: python-distributions-${{ github.sha }}
          path: dist/
      - name: Publish through the configured PyPI Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          attestations: true
