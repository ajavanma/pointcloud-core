name: Package and NumPy tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
        numpy-version: ['1.26.4', '2.*']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and build tools
        run: python -m pip install . 'numpy==${{ matrix.numpy-version }}' 'build>=1.2,<2' 'twine>=6,<7'
      - name: Build source distribution and wheel, and validate metadata
        run: |
          python -m build
          python -m twine check --strict dist/*
      - name: Test wheel outside the checkout
        run: |
          python -m venv "$RUNNER_TEMP/core-wheel"
          "$RUNNER_TEMP/core-wheel/bin/python" -m pip install dist/*.whl 'numpy==${{ matrix.numpy-version }}'
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/core-wheel/bin/python" -m unittest discover -s "$GITHUB_WORKSPACE/tests" -v
          "$RUNNER_TEMP/core-wheel/bin/python" -m pip check
